# This file is cite-wide's own pnpm settings file, not a shared workspace:
# `packages` lists only this plugin, so it installs and builds on its own.
# pnpm 11+ no longer reads the "pnpm" field in package.json; settings live here.
packages:
  - '.'

overrides:
  'ajv@<6.14.0': '^6.14.0'
  'js-yaml@<4.1.1': '^4.1.1'
  'minimatch@<3.1.4': '^3.1.4'
  'flatted@<3.4.2': '^3.4.2'

# pnpm 10 (CI, release.yml)
onlyBuiltDependencies:
  - esbuild

# pnpm 11+ (local)
allowBuilds:
  esbuild: true
